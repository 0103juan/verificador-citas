[project]
name = "verificador-citas"
version = "0.1.0"
description = "Checks citations of Colombian Constitutional Court rulings against the official register"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11",
    "model-gateway",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
model-gateway = { git = "https://github.com/0103juan/model-gateway", tag = "v0.1.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
